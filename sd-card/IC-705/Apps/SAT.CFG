# SO-50: the 74.4 Hz / 2-second activation carrier is operator-managed.
# STOP SAT for manual activation, then restart for normal 67 Hz access.
# SAT never sends an activation carrier.
# AO-91: current carrier-operated mode needs no CTCSS (AMSAT AO-91 page).
# Do not transmit in eclipse; predictions are geometric only.
