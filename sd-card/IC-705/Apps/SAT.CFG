# SAT 0.23 - edit with a plain-text editor. Restart SAT after changes.
# First enabled row = highest priority when visible passes overlap.
# Otherwise the earliest next pass wins, regardless of list order.
# Disable a satellite by placing # at the beginning of its row.
# Format: NAME,NORAD,RX_MHz,TX_MHz,CTCSS_Hz (0 disables TX tone)
# Maximum 8 enabled satellites; NAME uses 1-6 uppercase letters/digits/hyphens.
# FM cross-band profiles only: 144-148 MHz <-> 430-440 MHz.
# Add another satellite by copying a row and entering verified values.
# Its orbit must be an 80-110 minute LEO; data is downloaded at startup.
# No automatic PTT. Switching satellites waits until RX.
